;============================================================================
; The following keys are available for use in component sections, NOT
; group sections:
;
;----------------------------------------------------------------------------
; Key:
;   PROCESSOR=
;
; Values:
;   X86, NOT_X86, IA64, NOT_IA64, AMD64, NOT_AMD64, ALL
;
; Description:
;   The PROCESSOR key associates processors with components.  If a component
;   should not be installed on a computer that has a particular processor,
;   specify PROCESSOR=[NOT_X86|NOT_IA64|NOT_AMD64] in the component's section
;   and the checkbox next to the component in the Select Component Groups
;   treeview control will be grayed and unselectable.
;
; Notes:
;   * The values are case sensitive.
;   * If the key is not present, the component can be installed on any
;     computer.
;
; Examples:
;   1. Allow this component to be installed on X86 and IA64 computers
;   PROCESSOR=X86,IA64
;
;   2. Allow this component to be installed on all computers except AMD64
;      machines
;   PROCESSOR=NOT_AMD64
;
;   3. Specifying a processor is both valid and invalid will generate an
;      error and the user will not be allowed to install the component
;   PROCESSOR=X86, NOT_X86
;
;   4. Specifying an unknown value will generate an error and the user will
;      be allowed to install the component
;   PROCESSOR=UNKNOWN_PROCESSOR
;
;   5. Not specifying any value generates an error and the user will be
;      allowed to install the component
;   PROCESSOR=
;
;----------------------------------------------------------------------------
; Key:
;   OS=
;
; Values:
;   WIN2000, NOT_WIN2000, WINXP, NOT_WINXP, WIN2003, NOT_WIN2003, ALL
;
; Description:
;   The OS key associates operating systems with components.  If a component
;   should not be installed on a computer that has a particular operating
;   system, specify
;   OS=[NOT_WIN2000|NOT_WINXP|NOT_WIN2003]
;   in the component's section and the checkbox next to the component in the
;   Select Component Groups treeview control will be grayed and unselectable.
;
; Notes:
;   * The values are case sensitive.
;   * If not present, the component can be installed on any computer.
;
; Examples:
;   1. Allow this component to be installed only on Windows 2000 and Windows XP
;   OS=WIN2000,WINXP
;
;   2. Allow this component to be installed on all computers except Windows
;      2000 machines
;   OS=NOT_WIN2000
;
;   3. Specifying an OS is both valid and invalid will generate an error and
;      the user will not be allowed to install the component
;   OS=WINXP, NOT_WINXP
;
;   4. Specifying an unknown value will generate an error and the user will
;      be allowed to install the component
;   OS=UNKNOWN_OS
;
;   5. Not specifying any value generates an error and the user will be
;      allowed to install the component
;   OS=
;
;
;----------------------------------------------------------------------------
; Key:
;   CHECKED=
;
; Values:
;   1, DDK, NOT_DDK, IFS, NOT_IFS, HAL, NOT_HAL, PDK, NOT_PDK, ALL
;
; Description:
;   The CHECKED key selects a component to included in the default
;   installation.  If a component is not valid on a particular kit, specify
;   CHECKED=[NOT_DDK|NOT_IFS|NOT_HAL|NOT_PDK] in the component's section
;   and the component will not be included in the specified kit's default
;   installation.  However, the user is free to select the component.
;
; Notes:
;   * The values are case sensitive.
;   * If not present, the component will not be included in any kit's default
;     installation.
;
; Examples:
;   1. Include the component in all kits default installation
;   CHECKED=1
;
;   2. Include the component ONLY in the DDK kit's default installation
;   CHECKED=1,DDK
;
;   3. Include this component in the default installation of any kit except the
;      PDK
;   CHECKED=NOT_PDK
;
;   4. Specifying a kit is both valid and invalid will generate an error and
;      the user will not be allowed to install the component
;   Checked=PDK, NOT_PDK
;
;   5. Specifying an unknown value will generate an error and the user will
;      be allowed to install the component
;   checked=UNKNOWN_KIT
;
;   6. Not specifying any value generates an error and allows the component to
;      be included in the default installation on any computer
;   Checked=
;
;
;============================================================================

